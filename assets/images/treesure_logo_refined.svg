<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Transparent background (no fill) -->
  <defs>
    <style>
      .leaf-primary { fill: #5DC75D; }
      .leaf-secondary { fill: #4CAF50; }
    </style>
  </defs>
  
  <!-- Outer circle ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#5DC75D" stroke-width="18"/>
  
  <!-- Top leaf -->
  <ellipse cx="100" cy="65" rx="18" ry="28" fill="#5DC75D" transform="rotate(-20 100 65)"/>
  
  <!-- Bottom-left leaf -->
  <ellipse cx="75" cy="115" rx="18" ry="28" fill="#4CAF50" transform="rotate(50 75 115)"/>
  
  <!-- Bottom-right leaf -->
  <ellipse cx="125" cy="115" rx="18" ry="28" fill="#4CAF50" transform="rotate(-50 125 115)"/>
  
  <!-- Center white space for leaf design -->
  <ellipse cx="92" cy="85" rx="12" ry="20" fill="white" opacity="0.3"/>
  <ellipse cx="108" cy="85" rx="12" ry="20" fill="white" opacity="0.3"/>
</svg>