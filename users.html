<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management - TreeSure Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          },
          colors: {
            forest: {
              50: "#f1f8ee",
              100: "#ddeed7",
              200: "#bddcaf",
              300: "#98c982",
              500: "#5aa04f",
              600: "#4f9245",
              700: "#467f3c",
              800: "#3b6c33",
              900: "#2f5528"
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .edit-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 6, 23, 0.55);
      z-index: 120;
    }

    .edit-modal.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 760px;
      border-radius: 16px;
      border: 1px solid #d1fae5;
      background: #fff;
      box-shadow: 0 24px 70px -32px rgba(15, 23, 42, 0.45);
      padding: 24px;
      position: relative;
    }

    .close-modal {
      position: absolute;
      right: 14px;
      top: 14px;
      font-size: 24px;
      line-height: 1;
      background: transparent;
      border: 0;
      color: #64748b;
      cursor: pointer;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media (min-width: 768px) {
      .form-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #2fb36a;
      box-shadow: 0 0 0 4px rgba(47, 179, 106, 0.15);
    }

    #toast-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 130;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(92vw, 460px);
    }

    .toast {
      width: 100%;
      border-radius: 16px;
      border: 1px solid #d1fae5;
      background: #fff;
      box-shadow: 0 18px 50px -26px rgba(15, 23, 42, 0.45);
      padding: 22px;
      opacity: 0;
      transform: scale(0.92);
      transition: all 0.25s ease;
      position: relative;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: scale(1);
    }

    .toast .message {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #0f172a;
      font-weight: 600;
    }

    .toast .small-message {
      color: #0f172a;
      font-size: 15px;
      font-weight: 600;
    }

    .toast .message .icon {
      color: #467f3c;
      font-size: 20px;
    }

    .toast .close-btn {
      position: absolute;
      right: 10px;
      top: 8px;
      border: 0;
      background: transparent;
      font-size: 20px;
      color: #64748b;
      cursor: pointer;
    }

    .toast-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .toast .ok-btn,
    .toast .cancel-btn {
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 20px;
      cursor: pointer;
    }

    .toast .ok-btn {
      background: #467f3c;
      color: #fff;
    }

    .toast .cancel-btn {
      background: #e2e8f0;
      color: #334155;
    }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden bg-slate-50 font-sans text-slate-900 antialiased">
  <div id="toast-container"></div>

  <div class="flex min-h-screen w-full">
    <aside id="sidebar-container" class="hidden lg:block lg:w-[230px]"></aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="sticky top-0 z-30 border-b border-emerald-100 bg-forest-700 text-white shadow-sm">
        <div class="flex items-center justify-between gap-4 px-4 py-5 sm:px-6 lg:px-8">
          <div>
            <h1 class="flex items-center gap-2 text-3xl font-black tracking-tight"><i class="fas fa-users"></i> User Management</h1>
            <p class="mt-1 text-sm text-emerald-100">Manage admin users and their permissions</p>
          </div>
          <button id="openAddUserModalBtn" type="button" class="inline-flex items-center gap-2 rounded-xl bg-white px-4 py-2.5 text-sm font-bold text-forest-700 transition hover:bg-emerald-50">
            <i class="fa-solid fa-plus"></i>
            Add New User
          </button>
        </div>
      </header>

      <main class="w-full flex-1 space-y-6 px-4 py-6 sm:px-6 lg:px-8">
        <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="mb-4 flex items-center gap-2 text-3xl font-black text-slate-800"><span>🔍</span> Search Users</h2>
          <div class="relative">
            <i class="fa fa-search pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Search users by name, username, or email..." class="w-full rounded-xl border border-slate-300 bg-white py-3 pl-11 pr-4 text-sm outline-none transition focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100" />
          </div>
        </section>

        <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="mb-4 flex items-center gap-2 text-3xl font-black text-slate-800"><span>👥</span> List of Users</h2>
          <div class="overflow-x-auto">
            <table class="min-w-full border-separate border-spacing-0 overflow-hidden rounded-xl border border-slate-200">
              <thead>
                <tr class="bg-emerald-100 text-left text-sm font-bold text-emerald-950">
                  <th class="px-4 py-3">User ID</th>
                  <th class="px-4 py-3">Name</th>
                  <th class="px-4 py-3">Username</th>
                  <th class="px-4 py-3">Password</th>
                  <th class="px-4 py-3">Contact</th>
                  <th class="px-4 py-3">Address</th>
                  <th class="px-4 py-3">Role</th>
                  <th class="px-4 py-3">Status</th>
                  <th class="px-4 py-3 text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody" class="divide-y divide-slate-200 bg-white text-sm"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="mobileSidebarBackdrop" class="fixed inset-0 z-40 hidden bg-slate-950/50 lg:hidden"></div>
  <aside id="mobileSidebarPanel" class="fixed inset-y-0 left-0 z-50 hidden w-72 overflow-y-auto bg-white shadow-2xl lg:hidden"></aside>

  <div id="addUserModal" class="edit-modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="addUserTitle">
      <button type="button" class="close-modal" id="closeAddUserModal" aria-label="Close add user dialog">&times;</button>
      <h2 id="addUserTitle" class="mb-4 text-4xl font-black text-slate-800">Add New User</h2>
      <form id="addUserForm" class="user-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name" class="text-sm font-semibold text-emerald-900">Full Name</label>
            <input type="text" id="name" placeholder="Enter full name" required />
          </div>
          <div class="form-group">
            <label for="username" class="text-sm font-semibold text-emerald-900">Username</label>
            <input type="text" id="username" placeholder="Enter username" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password" class="text-sm font-semibold text-emerald-900">Password</label>
            <input type="password" id="password" placeholder="Enter password" required />
          </div>
          <div class="form-group">
            <label for="contact" class="text-sm font-semibold text-emerald-900">Contact Number</label>
            <input type="text" id="contact" placeholder="Enter contact number" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="address" class="text-sm font-semibold text-emerald-900">Address</label>
            <input type="text" id="address" placeholder="Enter address" required />
          </div>
          <div class="form-group">
            <label for="role" class="text-sm font-semibold text-emerald-900">Role</label>
            <select id="role">
              <option value="Forester">Forester</option>
              <option value="Applicant">Applicant</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="status" class="text-sm font-semibold text-emerald-900">Status</label>
            <select id="status">
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
          </div>
        </div>
        <div class="mt-4 flex justify-end gap-3 border-t border-slate-200 pt-4">
          <button id="cancelAddUserBtn" type="button" class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-2.5 text-sm font-bold text-emerald-900 transition hover:bg-emerald-100">
            <i class="fa fa-xmark"></i> Cancel
          </button>
          <button type="submit" class="btn-submit rounded-xl bg-forest-700 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-forest-600">
            <i class="fa fa-user-plus"></i> Add User
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="editUserModal" class="edit-modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editUserTitle">
      <button type="button" class="close-modal" id="closeEditModal" aria-label="Close edit user dialog">&times;</button>
      <h2 id="editUserTitle" class="mb-4 text-4xl font-black text-slate-800">Edit User</h2>
      <form id="editUserForm">
        <input type="hidden" id="editUserId" />
        <div class="form-row">
          <div class="form-group">
            <label for="editName" class="text-sm font-semibold text-emerald-900">Full Name</label>
            <input type="text" id="editName" placeholder="Full Name" required />
          </div>
          <div class="form-group">
            <label for="editUsername" class="text-sm font-semibold text-emerald-900">Username</label>
            <input type="text" id="editUsername" placeholder="Username" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="editPassword" class="text-sm font-semibold text-emerald-900">Password</label>
            <input type="password" id="editPassword" placeholder="Leave empty to keep current password" />
          </div>
          <div class="form-group">
            <label for="editContact" class="text-sm font-semibold text-emerald-900">Contact Number</label>
            <input type="text" id="editContact" placeholder="Contact Number" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="editAddress" class="text-sm font-semibold text-emerald-900">Address</label>
            <input type="text" id="editAddress" placeholder="Address" required />
          </div>
          <div class="form-group">
            <label for="editRole" class="text-sm font-semibold text-emerald-900">Role</label>
            <select id="editRole">
              <option value="Admin">Admin</option>
              <option value="Forester">Forester</option>
              <option value="Applicant">Applicant</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="editStatus" class="text-sm font-semibold text-emerald-900">Status</label>
            <select id="editStatus">
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
          </div>
        </div>

        <div class="mt-4 flex justify-end gap-3 border-t border-slate-200 pt-4">
          <button id="cancelEditBtn" type="button" class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-2.5 text-sm font-bold text-emerald-900 transition hover:bg-emerald-100">
            <i class="fa fa-xmark"></i> Cancel
          </button>
          <button type="submit" class="btn-submit rounded-xl bg-forest-700 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-forest-600">
            <i class="fa fa-floppy-disk"></i> Update User
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/users.js"></script>

  <script>
    fetch("sidebar.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("sidebar-container").innerHTML = html;
        document.getElementById("mobileSidebarPanel").innerHTML = html;

        const current = window.location.pathname.split("/").pop();
        document.querySelectorAll(".sidebar a").forEach(link => {
          if (link.getAttribute("href") === current) link.classList.add("active");
        });

        document.querySelectorAll("#mobileSidebarPanel .sidebar a").forEach(link => {
          if (link.getAttribute("href") === current) link.classList.add("active");
        });

        document.querySelectorAll("#sidebar-container #logoutBtn, #mobileSidebarPanel #logoutBtn").forEach(logoutBtn => {
          logoutBtn.addEventListener("click", e => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = "login.html";
          });
        });

        document.querySelectorAll("#sidebar-container .dropdown-toggle, #mobileSidebarPanel .dropdown-toggle").forEach(drop => {
          drop.addEventListener("click", e => {
            e.preventDefault();
            e.stopPropagation();

            document.querySelectorAll(".dropdown.open").forEach(openDropdown => {
              if (openDropdown !== drop.parentElement) {
                openDropdown.classList.remove("open");
              }
            });

            drop.parentElement.classList.toggle("open");
          });
        });

        document.addEventListener("click", e => {
          if (!e.target.closest(".dropdown")) {
            document.querySelectorAll(".dropdown.open").forEach(dropdown => {
              dropdown.classList.remove("open");
            });
          }
        });

        const appButtons = [
          { id: "ctpoBtn", type: "ctpo", title: "CTPO Applications" },
          { id: "pltpBtn", type: "pltp", title: "PLTP Applications" },
          { id: "spltpBtn", type: "spltp", title: "SPLTP Applications" },
          { id: "chainsawBtn", type: "chainsaw", title: "Chainsaw Registration" },
          { id: "covBtn", type: "cov", title: "Certificate of Verification" }
        ];

        appButtons.forEach(btn => {
          const element = document.getElementById(btn.id);
          if (element) {
            element.addEventListener("click", () => {
              localStorage.setItem("selectedApplicationType", btn.type);
              localStorage.setItem("selectedApplicationTitle", btn.title);
              window.location.href = "applications.html";
            });
          }
        });

        const mobileToggle = document.getElementById("mobileSidebarToggle");
        const mobilePanel = document.getElementById("mobileSidebarPanel");
        const mobileBackdrop = document.getElementById("mobileSidebarBackdrop");

        const closeMobileSidebar = () => {
          mobilePanel.classList.add("hidden");
          mobileBackdrop.classList.add("hidden");
        };

        mobileToggle?.addEventListener("click", () => {
          mobilePanel.classList.remove("hidden");
          mobileBackdrop.classList.remove("hidden");
        });

        mobileBackdrop?.addEventListener("click", closeMobileSidebar);
        document.querySelectorAll("#mobileSidebarPanel a").forEach(link => {
          link.addEventListener("click", closeMobileSidebar);
        });
      });

    const addUserModal = document.getElementById("addUserModal");
    const openAddUserModalBtn = document.getElementById("openAddUserModalBtn");
    const closeAddUserModal = document.getElementById("closeAddUserModal");
    const cancelAddUserBtn = document.getElementById("cancelAddUserBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const closeEditModalBtn = document.getElementById("closeEditModal");
    const editUserModal = document.getElementById("editUserModal");

    const closeAddModal = () => {
      addUserModal.classList.remove("show");
      addUserModal.setAttribute("aria-hidden", "true");
    };

    openAddUserModalBtn?.addEventListener("click", () => {
      addUserModal.classList.add("show");
      addUserModal.setAttribute("aria-hidden", "false");
    });

    closeAddUserModal?.addEventListener("click", closeAddModal);
    cancelAddUserBtn?.addEventListener("click", closeAddModal);

    cancelEditBtn?.addEventListener("click", () => {
      editUserModal.classList.remove("show");
      editUserModal.setAttribute("aria-hidden", "true");
    });

    closeEditModalBtn?.addEventListener("click", () => {
      editUserModal.classList.remove("show");
      editUserModal.setAttribute("aria-hidden", "true");
    });

    window.addEventListener("click", e => {
      if (e.target === addUserModal) closeAddModal();
      if (e.target === editUserModal) {
        editUserModal.classList.remove("show");
        editUserModal.setAttribute("aria-hidden", "true");
      }
    });
  </script>

  <script type="module" src="js/application-temp-fix.js"></script>
</body>

</html>
